spring.datasource.url=${AIVEN_DB_URL:${DB_URL}}

spring.datasource.username=${AIVEN_DB_USER:${DB_USER}}
spring.datasource.password=${AIVEN_DB_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
